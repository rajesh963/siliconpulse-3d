name: Build desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch Electron runtime
        run: node node_modules/electron/install.js
        env:
          electron_config_cache: ${{ github.workspace }}/.electron-cache
      - run: npm run package:linux:dir
      - run: cd release && zip -qr SiliconPulse-3D-linux-x64.zip linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: SiliconPulse-3D-linux
          path: release/SiliconPulse-3D-linux-x64.zip
          if-no-files-found: error
